<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Academia de Judo</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dojo-charcoal': '#2C2C2C',
                        'dojo-cream': '#F5F3F0',
                        'dojo-gold': '#B8860B',
                        'dojo-sage': '#9CAF88'
                    },
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'body': ['Inter', 'sans-serif'],
                        'japanese': ['Noto Sans JP', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        .hero-bg {
            background: linear-gradient(135deg, rgba(44, 44, 44, 0.8), rgba(156, 175, 136, 0.4)), 
                        url('resources/hero-dojo.png') center/cover no-repeat;
            min-height: 100vh;
        }
        
        .form-blur {
            backdrop-filter: blur(10px);
            background: rgba(245, 243, 240, 0.95);
        }
        
        .belt-gradient {
            background: linear-gradient(90deg, 
                #FFFFFF 0%, #FFFFFF 14%,
                #FFFF00 14%, #FFFF00 28%,
                #FFA500 28%, #FFA500 42%,
                #008000 42%, #008000 57%,
                #0000FF 57%, #0000FF 71%,
                #A52A2A 71%, #A52A2A 85%,
                #000000 85%, #000000 100%);
            height: 4px;
            border-radius: 2px;
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(184, 134, 11, 0.15);
        }
        
        .password-strength {
            transition: width 0.3s ease;
        }
        
        .strength-weak { background-color: #EF4444; }
        .strength-medium { background-color: #F59E0B; }
        .strength-strong { background-color: #10B981; }
    </style>
</head>
<body class="font-body">
    <!-- Background -->
    <div class="hero-bg fixed inset-0 z-0"></div>
    
    <!-- Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <img src="resources/judo-logo.png" alt="Judo Academy Logo" class="h-20 w-20 mx-auto mb-4">
                <h1 class="font-display text-4xl font-bold text-white mb-2">Academia de Judo</h1>
                <div class="belt-gradient w-24 mx-auto mb-4"></div>
                <p class="text-dojo-cream text-lg">Inicia tu camino en el judo</p>
            </div>
            
            <!-- Login Form -->
            <div id="loginFormContainer" class="form-blur rounded-xl shadow-2xl p-8">
                <h2 class="font-display text-2xl font-bold text-dojo-charcoal mb-6 text-center">Bienvenido</h2>
                
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-dojo-charcoal mb-2">Email</label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                               placeholder="tu@email.com">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-dojo-charcoal mb-2">Contraseña</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                   class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                                   placeholder="••••••••">
                            <button type="button" id="togglePassword" class="absolute right-3 top-3 p-1 text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" name="remember" class="rounded border-gray-300 text-dojo-gold focus:ring-dojo-gold">
                            <span class="ml-2 text-sm text-dojo-charcoal">Recordarme</span>
                        </label>
                        <a href="#" class="text-sm text-dojo-gold hover:underline">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-dojo-gold text-white py-3 px-6 rounded-lg font-semibold hover:bg-opacity-90 transition-all transform hover:scale-105">
                        Iniciar Sesión
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        ¿No tienes cuenta? 
                        <button onclick="showRegisterForm()" class="text-dojo-gold hover:underline font-medium">
                            Regístrate aquí
                        </button>
                    </p>
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="registerFormContainer" class="form-blur rounded-xl shadow-2xl p-8 hidden">
                <h2 class="font-display text-2xl font-bold text-dojo-charcoal mb-6 text-center">Crear Cuenta</h2>
                
                <form id="registerForm" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-dojo-charcoal mb-2">Nombre</label>
                            <input type="text" id="firstName" name="firstName" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                                   placeholder="Tu nombre">
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm font-medium text-dojo-charcoal mb-2">Apellido</label>
                            <input type="text" id="lastName" name="lastName" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                                   placeholder="Tu apellido">
                        </div>
                    </div>
                    
                    <div>
                        <label for="registerEmail" class="block text-sm font-medium text-dojo-charcoal mb-2">Email</label>
                        <input type="email" id="registerEmail" name="email" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                               placeholder="tu@email.com">
                    </div>
                    
                    <div>
                        <label for="registerPassword" class="block text-sm font-medium text-dojo-charcoal mb-2">Contraseña</label>
                        <div class="relative">
                            <input type="password" id="registerPassword" name="password" required
                                   class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                                   placeholder="••••••••">
                            <button type="button" id="toggleRegisterPassword" class="absolute right-3 top-3 p-1 text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="mt-2">
                            <div class="flex justify-between text-xs text-gray-500 mb-1">
                                <span>Seguridad de contraseña</span>
                                <span id="passwordStrengthText">Débil</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="passwordStrengthBar" class="password-strength strength-weak h-2 rounded-full" style="width: 25%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-dojo-charcoal mb-2">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent"
                               placeholder="••••••••">
                    </div>
                    
                    <div>
                        <label for="experience" class="block text-sm font-medium text-dojo-charcoal mb-2">Nivel de Experiencia</label>
                        <select id="experience" name="experience" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-dojo-gold focus:border-transparent">
                            <option value="">Selecciona tu nivel</option>
                            <option value="complete_beginner">Principiante completo</option>
                            <option value="some_experience">Algo de experiencia</option>
                            <option value="intermediate">Intermedio</option>
                            <option value="advanced">Avanzado</option>
                        </select>
                    </div>
                    
                    <div class="flex items-start">
                        <input type="checkbox" id="terms" name="terms" required class="mt-1 rounded border-gray-300 text-dojo-gold focus:ring-dojo-gold">
                        <label for="terms" class="ml-2 text-sm text-dojo-charcoal">
                            Acepto los <a href="#" class="text-dojo-gold hover:underline">términos y condiciones</a> y la <a href="#" class="text-dojo-gold hover:underline">política de privacidad</a>
                        </label>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-dojo-gold text-white py-3 px-6 rounded-lg font-semibold hover:bg-opacity-90 transition-all transform hover:scale-105">
                        Crear Cuenta
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        ¿Ya tienes cuenta? 
                        <button onclick="showLoginForm()" class="text-dojo-gold hover:underline font-medium">
                            Inicia sesión
                        </button>
                    </p>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="text-center mt-8">
                <p class="text-dojo-cream text-sm">
                    © 2024 Academia de Judo. Todos los derechos reservados.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Authentication functionality
        document.addEventListener('DOMContentLoaded', function() {
            initializeAuth();
        });
        
        function initializeAuth() {
            setupFormHandlers();
            setupPasswordToggle();
            setupPasswordStrength();
        }
        
        function setupFormHandlers() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
            
            if (registerForm) {
                registerForm.addEventListener('submit', handleRegister);
            }
        }
        
        function setupPasswordToggle() {
            const toggleButtons = [
                { button: 'togglePassword', input: 'password' },
                { button: 'toggleRegisterPassword', input: 'registerPassword' }
            ];
            
            toggleButtons.forEach(({ button, input }) => {
                const toggleBtn = document.getElementById(button);
                const passwordInput = document.getElementById(input);
                
                if (toggleBtn && passwordInput) {
                    toggleBtn.addEventListener('click', () => {
                        const type = passwordInput.type === 'password' ? 'text' : 'password';
                        passwordInput.type = type;
                        
                        // Update icon
                        const icon = toggleBtn.querySelector('svg');
                        if (type === 'text') {
                            icon.innerHTML = `
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.974 9.974 0 011.879-3.659M15.75 15.75A10.05 10.05 0 0112 17c4.478 0 8.268-2.943 9.543-7a9.974 9.974 0 01-1.879 3.659M13.875 18.825L19.625 13.075M13.875 5.175L19.625 10.925"></path>
                            `;
                        } else {
                            icon.innerHTML = `
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            `;
                        }
                    });
                }
            });
        }
        
        function setupPasswordStrength() {
            const passwordInput = document.getElementById('registerPassword');
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');
            
            if (passwordInput && strengthBar && strengthText) {
                passwordInput.addEventListener('input', (e) => {
                    const password = e.target.value;
                    const strength = calculatePasswordStrength(password);
                    
                    // Update strength bar
                    strengthBar.style.width = `${strength.percentage}%`;
                    strengthBar.className = `password-strength h-2 rounded-full ${strength.class}`;
                    
                    // Update strength text
                    strengthText.textContent = strength.text;
                });
            }
        }
        
        function calculatePasswordStrength(password) {
            let score = 0;
            
            // Length
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            
            // Character types
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            
            // Calculate percentage and classification
            const percentage = Math.min(100, (score / 7) * 100);
            
            if (percentage < 30) {
                return { percentage, class: 'strength-weak', text: 'Débil' };
            } else if (percentage < 60) {
                return { percentage, class: 'strength-medium', text: 'Media' };
            } else {
                return { percentage, class: 'strength-strong', text: 'Fuerte' };
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');
            
            try {
                // Show loading state
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Iniciando sesión...';
                submitBtn.disabled = true;
                
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Mock authentication - in real app, this would call Supabase
                const mockUser = {
                    id: Date.now().toString(),
                    email: email,
                    user_metadata: {
                        full_name: email.split('@')[0],
                        role: email.includes('admin') ? 'admin' : 'student'
                    }
                };
                
                // Store user data
                localStorage.setItem('judo_user', JSON.stringify(mockUser));
                
                // Show success message
                showAuthNotification('¡Bienvenido! Has iniciado sesión correctamente.', 'success');
                
                // Redirect based on user role
                setTimeout(() => {
                    if (mockUser.user_metadata.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'user-portal.html';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showAuthNotification('Error al iniciar sesión. Verifica tus credenciales.', 'error');
            } finally {
                // Reset button state
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const firstName = formData.get('firstName');
            const lastName = formData.get('lastName');
            const email = formData.get('email');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            const experience = formData.get('experience');
            const terms = formData.get('terms');
            
            // Validation
            if (password !== confirmPassword) {
                showAuthNotification('Las contraseñas no coinciden', 'error');
                return;
            }
            
            if (!terms) {
                showAuthNotification('Debes aceptar los términos y condiciones', 'error');
                return;
            }
            
            try {
                // Show loading state
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Creando cuenta...';
                submitBtn.disabled = true;
                
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Mock user registration - in real app, this would call Supabase
                const mockUser = {
                    id: Date.now().toString(),
                    email: email,
                    user_metadata: {
                        full_name: `${firstName} ${lastName}`,
                        role: 'student',
                        experience: experience
                    }
                };
                
                // Store user data
                localStorage.setItem('judo_user', JSON.stringify(mockUser));
                
                // Show success message
                showAuthNotification('¡Cuenta creada exitosamente! Bienvenido a la academia.', 'success');
                
                // Redirect to user portal
                setTimeout(() => {
                    window.location.href = 'user-portal.html';
                }, 1500);
                
            } catch (error) {
                console.error('Registration error:', error);
                showAuthNotification('Error al crear la cuenta. Intenta de nuevo.', 'error');
            } finally {
                // Reset button state
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
        
        function showRegisterForm() {
            document.getElementById('loginFormContainer').classList.add('hidden');
            document.getElementById('registerFormContainer').classList.remove('hidden');
            
            // Animate form change
            if (typeof anime !== 'undefined') {
                anime({
                    targets: '#registerFormContainer',
                    opacity: [0, 1],
                    translateY: [20, 0],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
            }
        }
        
        function showLoginForm() {
            document.getElementById('registerFormContainer').classList.add('hidden');
            document.getElementById('loginFormContainer').classList.remove('hidden');
            
            // Animate form change
            if (typeof anime !== 'undefined') {
                anime({
                    targets: '#loginFormContainer',
                    opacity: [0, 1],
                    translateY: [20, 0],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
            }
        }
        
        function showAuthNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg max-w-sm transform translate-x-full transition-transform duration-300 ${
                type === 'success' ? 'bg-green-500 text-white' :
                type === 'error' ? 'bg-red-500 text-white' :
                'bg-blue-500 text-white'
            }`;
            
            notification.innerHTML = `
                <div class="flex items-center justify-between">
                    <p>${message}</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-white hover:text-gray-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.remove();
                    }
                }, 300);
            }, 5000);
        }
        
        // Initialize animations
        if (typeof anime !== 'undefined') {
            anime({
                targets: '.form-blur',
                opacity: [0, 1],
                translateY: [30, 0],
                duration: 800,
                delay: 300,
                easing: 'easeOutQuad'
            });
        }
    </script>
</body>
</html>
